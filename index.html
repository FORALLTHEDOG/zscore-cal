<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특목고·자사고 Z-Score 환산 계산기</title>
<style>
  :root {
    --bg: #f1f4fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7690;
    --primary: #4263eb;
    --primary-dark: #3451c7;
    --border: #dde3f0;
    --danger: #e03131;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(34, 52, 120, 0.10);
    --t1: #c92a2a;
    --t2: #e8590c;
    --t3: #f08c00;
    --t4: #2f9e44;
    --t5: #1c7ed6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; }
  header p { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fafbff;
    color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(66, 99, 235, 0.15);
    background: #fff;
  }
  .field input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(224, 49, 49, 0.12); }
  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:active { transform: scale(0.98); }
  #calcBtn { flex: 2; background: var(--primary); color: #fff; }
  #calcBtn:hover { background: var(--primary-dark); }
  #resetBtn { flex: 1; background: #e9edf8; color: var(--muted); }
  #resetBtn:hover { background: #dde3f0; }
  #result { display: none; animation: fadeUp .4s ease; }
  #result.show { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .stat {
    background: #f5f7ff;
    border-radius: 12px;
    padding: 16px 10px;
    text-align: center;
  }
  .stat .label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .stat .value { font-size: 1.7rem; font-weight: 800; margin-top: 4px; color: var(--primary); }
  .stat .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .stat.full { grid-column: 1 / -1; }
  .stat.full .value { font-size: 2.2rem; }
  .tier {
    border-left: 6px solid var(--t5);
    background: #f9fafe;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .tier .tier-title { font-size: 1.1rem; font-weight: 800; }
  .tier .tier-desc { font-size: 0.92rem; color: var(--muted); margin-top: 4px; }
  .tier-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .bar-wrap { margin-top: 16px; }
  .bar { height: 10px; background: #e9edf8; border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #748ffc, var(--primary)); border-radius: 99px; transition: width .6s ease; }
  .bar-caption { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  #ad-banner {
    min-height: 90px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a6afc5;
    font-size: 0.85rem;
    background: #fafbff;
    margin-bottom: 14px;
  }
  .disclaimer {
    font-size: 0.75rem;
    color: #8c96ad;
    text-align: center;
    line-height: 1.6;
    padding: 0 6px;
  }
  @media (max-width: 420px) {
    .card { padding: 18px; }
    header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📊 Z-Score 환산 등급 계산기</h1>
    <p>특목고·자사고 내신을 일반고 기준 9등급으로 환산해 보세요</p>
  </header>

  <section class="card">
    <div class="field">
      <label for="rawScore">원점수</label>
      <input type="number" id="rawScore" inputmode="decimal" step="any" placeholder="예) 92">
    </div>
    <div class="field">
      <label for="avgScore">과목 평균</label>
      <input type="number" id="avgScore" inputmode="decimal" step="any" placeholder="예) 71.5">
    </div>
    <div class="field">
      <label for="stdDev">표준편차</label>
      <input type="number" id="stdDev" inputmode="decimal" step="any" placeholder="예) 12.3">
    </div>
    <div class="btn-row">
      <button id="calcBtn" type="button">계산하기</button>
      <button id="resetBtn" type="button">초기화</button>
    </div>
  </section>

  <section class="card" id="result" aria-live="polite">
    <div class="stats">
      <div class="stat">
        <div class="label">Z-Score</div>
        <div class="value" id="zOut">-</div>
      </div>
      <div class="stat">
        <div class="label">누적 상위 백분율</div>
        <div class="value" id="pctOut">-</div>
        <div class="sub">%</div>
      </div>
      <div class="stat full">
        <div class="label">일반고 환산 등급</div>
        <div class="value" id="gradeOut">-</div>
      </div>
    </div>
    <div class="tier-label">목표 대학 권역</div>
    <div class="tier" id="tierBox">
      <div class="tier-title" id="tierTitle">-</div>
      <div class="tier-desc" id="tierDesc">-</div>
    </div>
    <div class="bar-wrap">
      <div class="bar"><span id="barFill"></span></div>
      <div class="bar-caption"><span>하위</span><span>상위</span></div>
    </div>
  </section>

  <div id="ad-banner">광고 영역 (Google AdSense / Kakao AdFit)</div>

  <p class="disclaimer">
    본 계산 결과는 정규분포를 가정한 수학적 추정치이며 참고용입니다.<br>
    실제 대학 입시는 학생부종합전형 등 정성평가가 반영되므로, 결과가 합격 가능성을 보장하지 않습니다.
  </p>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var rawEl = $("rawScore"), avgEl = $("avgScore"), sdEl = $("stdDev");

  // Standard normal CDF via erf approximation (Abramowitz & Stegun 7.1.26)
  function erf(x) {
    var sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    var t = 1 / (1 + p * x);
    var y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }
  function normCdf(z) {
    return 0.5 * (1 + erf(z / Math.SQRT2));
  }

  function toGrade(topPct) {
    var cuts = [4, 11, 23, 40, 60, 77, 89, 96];
    for (var i = 0; i < cuts.length; i++) {
      if (topPct <= cuts[i]) return i + 1;
    }
    return 9;
  }

  function toTier(z) {
    if (z >= 1.75) return { title: "최상위권", desc: "서울대, 의치한약수, KAIST/POSTECH", color: "var(--t1)" };
    if (z >= 1.25) return { title: "상위권", desc: "연세대, 고려대학교, UNIST, DGIST", color: "var(--t2)" };
    if (z >= 0.75) return { title: "중상위권", desc: "서강대, 성균관대, 한양대, 중앙대, 경희대, 외대, 서울시립대", color: "var(--t3)" };
    if (z >= 0.25) return { title: "중위권", desc: "건국대, 동국대, 홍익대, 숙명여대, 국민대, 숭실대", color: "var(--t4)" };
    return { title: "일반 권역", desc: "수도권 주요 대학 및 지방 거점 국립대", color: "var(--t5)" };
  }

  function clearInvalid() {
    [rawEl, avgEl, sdEl].forEach(function (el) { el.classList.remove("invalid"); });
  }

  function fail(el, msg) {
    el.classList.add("invalid");
    alert(msg);
    el.focus();
  }

  function parseField(el) {
    var s = el.value.trim();
    if (s === "") return NaN;
    return Number(s);
  }

  function calculate() {
    clearInvalid();
    var raw = parseField(rawEl), avg = parseField(avgEl), sd = parseField(sdEl);

    if (rawEl.value.trim() === "") return fail(rawEl, "원점수를 입력해 주세요.");
    if (!isFinite(raw)) return fail(rawEl, "원점수에 올바른 숫자를 입력해 주세요.");
    if (avgEl.value.trim() === "") return fail(avgEl, "과목 평균을 입력해 주세요.");
    if (!isFinite(avg)) return fail(avgEl, "과목 평균에 올바른 숫자를 입력해 주세요.");
    if (sdEl.value.trim() === "") return fail(sdEl, "표준편차를 입력해 주세요.");
    if (!isFinite(sd)) return fail(sdEl, "표준편차에 올바른 숫자를 입력해 주세요.");
    if (sd <= 0) return fail(sdEl, "표준편차는 0보다 커야 합니다.");
    if (raw < 0 || avg < 0) return fail(raw < 0 ? rawEl : avgEl, "점수는 0 이상이어야 합니다.");

    var z = (raw - avg) / sd;
    var topPct = (1 - normCdf(z)) * 100;
    topPct = Math.min(100, Math.max(0, topPct));
    var grade = toGrade(topPct);
    var tier = toTier(z);

    $("zOut").textContent = z.toFixed(2);
    $("pctOut").textContent = topPct.toFixed(2);
    $("gradeOut").textContent = grade + "등급";
    $("tierTitle").textContent = tier.title;
    $("tierDesc").textContent = tier.desc;
    $("tierTitle").style.color = tier.color;
    $("tierBox").style.borderLeftColor = tier.color;

    var res = $("result");
    res.classList.add("show");
    $("barFill").style.width = "0";
    setTimeout(function () { $("barFill").style.width = (100 - topPct).toFixed(1) + "%"; }, 30);
    res.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function reset() {
    rawEl.value = avgEl.value = sdEl.value = "";
    clearInvalid();
    $("result").classList.remove("show");
    rawEl.focus();
  }

  $("calcBtn").addEventListener("click", calculate);
  $("resetBtn").addEventListener("click", reset);
  [rawEl, avgEl, sdEl].forEach(function (el) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter") calculate(); });
    el.addEventListener("input", function () { el.classList.remove("invalid"); });
  });
})();
</script>
</body>
</html>
